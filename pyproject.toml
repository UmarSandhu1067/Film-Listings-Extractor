[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-listings-extractor"
version = "0.1.0"
description = "Extract film project and role listings from supplied PDF layouts."
requires-python = ">=3.12"
dependencies = [
    "pdfplumber==0.11.10",
    "pydantic==2.14.3",
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
]

[project.scripts]
extract = "src.main:cli"
extract-v2 = "src.v2.main:cli"

[tool.setuptools]
packages = ["src", "src.parsers", "src.v2"]
